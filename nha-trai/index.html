<body>
  <div id="flowerLayer"></div>
  <main class="scene">
    <section class="invitation-card cover-card">
      <img class="branch-image branch-left translate-left rotate-left" src="../assets/branch.png" alt="" aria-hidden="true">
      <img class="branch-image branch-right translate-right rotate-right bottom-right" src="../assets/branch.png" alt="" aria-hidden="true">

      <div class="heart-medallion" aria-hidden="true">
        <svg class="heart-icon" viewBox="0 0 24 24" role="presentation">
          <path d="M12 21.1 10.55 19.8C5.4 15.13 2 12.05 2 8.27 2 5.19 4.42 2.8 7.5 2.8c1.74 0 3.41.81 4.5 2.09a6.02 6.02 0 0 1 4.5-2.09c3.08 0 5.5 2.39 5.5 5.47 0 3.78-3.4 6.86-8.55 11.54L12 21.1Z"/>
        </svg>
      </div>
      <div style="margin-top: 40px;">
        <h1 class="groom-bride">
          <p style="margin-right: 40px;" data-config="groom"></p>
          <p style="margin-left: 40px;" data-config="bride"></p>
        </h1>
      </div>
      <div class="ornament">
        <i></i>
        <b>❦</b>
        <i></i>
      </div>
      <p class="date" data-config="dateShort"></p>
      <p class="invite-line">Thân Mời</p>
      <div style="margin-top: 60px;">
        <a class="open-button" id="openInvitation" href="invitation.html">Mở thiệp</a>
      </div>
    </section>
    <p class="signature">Made with love</p>
  </main>
  <script src="script.js"></script>
